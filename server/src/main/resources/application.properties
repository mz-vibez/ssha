spring.application.name=ssha
server.port=9091
# Behind the https load balancer: honour X-Forwarded-* headers.
server.forward-headers-strategy=framework
# SSE connections are long-lived; let SseEmitter's own timeout govern them.
spring.mvc.async.request-timeout=-1
# Text is compressed here too (a proxy that compresses skips what is already encoded); the event stream is not
# in the list, so it is never buffered.
server.compression.enabled=true
server.compression.min-response-size=512
# The page's own files are not versioned: always ask (cheap, 304) so a new release is picked up.
spring.web.resources.cache.cachecontrol.no-cache=true
# The PWA manifest's own media type (Tomcat doesn't know .webmanifest).
server.mime-mappings.webmanifest=application/manifest+json

# Auth
ssha.rp-id=ssha.apps.maykelange.com
ssha.allowed-origins=https://ssha.apps.maykelange.com
# Whether anyone may create an account with `ssha-cli` (no token yet, no --account).
ssha.open-registration=true
# Web Push: the server's key pair (generated on first start) and the contact the push services see.
ssha.vapid-key-file=${ssha.data-dir}/vapid
ssha.vapid-subject=https://ssha.apps.maykelange.com
# The CLI offered on the Computers page: the native executable, if built (`mise run native`).
ssha.downloads-dir=${ssha.project-dir:.}/cli/target
# The single-user version's CLI token; on the first start with accounts it becomes a client of the migrated account.
ssha.legacy-token-file=${ssha.data-dir}/token

# Sessions: stay signed in on the phone for 30 days of inactivity.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Runtime data (passkeys, CLI token) lives in <project>/data. ssha.project-dir is set at startup
# from the jar's location, so this works whatever directory the server is started from.
ssha.data-dir=${ssha.project-dir:.}/data
spring.datasource.url=jdbc:h2:file:${ssha.data-dir}/ssha
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
