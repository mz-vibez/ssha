spring.application.name=ssha
server.port=9091
# Behind the https load balancer: honour X-Forwarded-* headers.
server.forward-headers-strategy=framework
# SSE connections are long-lived; let SseEmitter's own timeout govern them.
spring.mvc.async.request-timeout=-1
server.compression.enabled=false

# Auth
ssha.username=maykelange
ssha.rp-id=ssha.apps.maykelange.com
ssha.allowed-origins=https://ssha.apps.maykelange.com
# Leave empty to use (and on first start generate) the token file below.
ssha.api-token=
ssha.api-token-file=${ssha.data-dir}/token

# Sessions: stay signed in on the phone for 30 days of inactivity.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Runtime data (passkeys, CLI token) lives in <project>/data. ssha.project-dir is set at startup
# from the jar's location, so this works whatever directory the server is started from.
ssha.data-dir=${ssha.project-dir:.}/data
spring.datasource.url=jdbc:h2:file:${ssha.data-dir}/ssha
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
