<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: meta('ssha')}"></th:block>
    <meta name="vapid-key" th:content="${vapidKey}">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" defer></script>
    <script src="/app.js" defer></script>
    <script src="/ssh.js" defer></script>
</head>
<body hx-ext="sse" th:attr="sse-connect=@{/stream}">
<header>
    <h1>ssha</h1>
    <span id="status" class="status">offline</span>
    <nav>
        <a href="/keys">Keys</a>
        <a href="/clients">Computers</a>
        <a href="/passkeys">Passkeys</a>
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="link">Sign out</button>
        </form>
    </nav>
</header>

<main>
    <div id="push" class="push" hidden>
        <span data-push-text></span>
        <button type="button" data-push-enable>Turn on notifications</button>
    </div>
    <!-- SSH sign requests waiting for approval; the stream sends every pending one on (re)connect. -->
    <section id="approvals" sse-swap="sign" hx-swap="beforeend"></section>
    <p class="empty">
        No sign requests waiting.<br>
        Keep this page open while you use <code>ssha-cli agent</code>; requests show up here.<br>
        <a href="/clients#add">Get the agent for a computer</a>
    </p>
</main>
</body>
</html>
