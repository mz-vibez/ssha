<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="enroll" class="sign join" th:id="|enroll-${p.id}|">
    <div class="sign-title warn">
        <strong>Sign-in link</strong>
        <time th:datetime="${p.requestedAt}"
              th:text="${#temporals.format(p.requestedAt.atZone(T(java.time.ZoneId).systemDefault()), 'HH:mm:ss')}">12:00:00</time>
    </div>
    <dl>
        <dt>From</dt>
        <dd th:text="${p.client.name}">laptop</dd>
        <th:block th:if="${!#strings.isEmpty(p.code)}">
            <dt>Code</dt>
            <dd><strong th:text="${p.code}">123 456</strong></dd>
        </th:block>
    </dl>
    <p class="warning">
        A sign-in link gives full control of this account: whoever opens it can add their own passkey.
        Accept only if you just ran <code>ssha-cli enroll</code> there and its terminal shows the same code.
    </p>
    <div class="actions">
        <button type="button" class="deny" th:attr="hx-post=|/enroll/${p.id}/deny|" hx-swap="none">Deny</button>
        <button type="button" class="approve" th:attr="hx-post=|/enroll/${p.id}/accept|" hx-swap="none">Accept</button>
    </div>
</section>
</body>
</html>
