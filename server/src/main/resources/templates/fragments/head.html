<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="meta(title)">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#111418">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title}">ssha</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" th:href="@{/icon-180.png}">
    <meta name="apple-mobile-web-app-title" content="ssha">
    <script th:src="@{/push.js}" defer></script>
    <script th:src="@{/confirm.js}" defer></script>
</th:block>
</head>
