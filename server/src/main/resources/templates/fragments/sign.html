<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="sign" class="sign" th:id="|sign-${p.id}|"
         th:attr="data-request=${p.id},data-key=${p.key.id},data-payload=${p.payload()},data-hash=${p.hash()},
                  data-kind=${p.details.kind},data-user=${p.details.user},data-namespace=${p.details.namespace},
                  data-host-key=${p.details.hostKey},data-warning=${p.details.warning != null}">
    <div class="sign-title" th:classappend="${p.details.warning} ? 'warn'">
        <strong th:text="${p.details.kind}">SSH login</strong>
        <time th:datetime="${p.requestedAt}"
              th:text="${#temporals.format(p.requestedAt.atZone(T(java.time.ZoneId).systemDefault()), 'HH:mm:ss')}">12:00:00</time>
    </div>
    <dl>
        <dt>Key</dt>
        <dd><span th:text="${p.key.label}">laptop</span> <span class="hint" th:text="${p.key.type()}">ED25519</span></dd>
        <th:block th:if="${p.details.user}">
            <dt>User</dt>
            <dd th:text="${p.details.user}">git</dd>
        </th:block>
        <th:block th:if="${p.details.hostKey}">
            <dt>Host</dt>
            <dd><strong th:if="${p.hostName}" th:text="${p.hostName}">example.com</strong>
                <code th:text="${p.details.hostKey}">SHA256:…</code>
                <span th:class="${p.details.hostVerified} ? 'ok' : 'bad'"
                      th:text="${p.details.hostVerified} ? 'verified' : 'unverified'">verified</span>
                <span th:if="${p.newHost()}" class="bad">· first login to this host</span>
                <span th:if="${p.host}" class="hint"
                      th:text="|· ${p.host.logins} earlier login${p.host.logins == 1 ? '' : 's'} since ${#temporals.format(p.host.firstSeen.atZone(T(java.time.ZoneId).systemDefault()), 'yyyy-MM-dd')}|">· 3 earlier logins since 2026-10-01</span></dd>
        </th:block>
        <th:block th:if="${p.details.namespace}">
            <dt>Purpose</dt>
            <dd th:text="${p.details.namespace}">git</dd>
        </th:block>
        <dt>From</dt>
        <dd><span th:text="${p.client.name}">laptop</span><th:block th:if="${p.details.forwarded}"> (forwarded agent)</th:block></dd>
    </dl>
    <p class="warning" th:if="${p.details.warning}" th:text="${p.details.warning}">Warning</p>
    <p class="warning" th:if="${p.concurrent}">
        Another request was already waiting when this one came in. Approve only the ones you started.
    </p>
    <p class="error" data-sign-error hidden></p>
    <div class="actions">
        <button type="button" class="deny" th:attr="data-post=|/sign/${p.id}/deny|">Deny</button>
        <button type="button" class="approve" data-ssh-approve>Approve</button>
    </div>
</section>
</body>
</html>
